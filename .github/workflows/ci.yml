name: CI build

# Targets kept in this build: Android, Windows (PC), WebAssembly (web).
# Linux / macOS / iOS / Nintendo Switch / Arch Linux packaging were removed from
# both the source tree and this workflow on purpose.
on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # vcpkg binary cache; restored/saved per-OS via actions/cache below
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite

jobs:
  build-windows-x64:
    name: Build for Windows (PC, MSVC x64)
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: ilammy/msvc-dev-cmd@v1

    # Key tracks the MSVC toolset (part of vcpkg's ABI hash) but not the system CMake version: vcpkg builds ports with its own pinned CMake.
    - name: Get toolchain ID for cache key
      shell: pwsh
      run: |
        $tc = $env:VCToolsVersion
        if (-not $tc) { $tc = "unknown" }
        echo "VCPKG_TC=msvc-$tc" >> $env:GITHUB_ENV

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: vcpkg-cache
        key: vcpkg-windows-x64-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-windows-x64-${{ env.VCPKG_TC }}-
          vcpkg-windows-x64-

    - name: Install Ninja
      run: choco install ninja -y

    - name: Setup vcpkg (manifest mode)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Compile PvZ-Portable for Windows (MSVC)
      shell: pwsh
      run: |
        cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DCONSOLE=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
        cmake --build build

        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item build/pvz-portable.exe dist/

    - name: Protocol tests (net codec)
      shell: pwsh
      run: |
        cmake -S tests -B build-net -G "Ninja" -DCMAKE_BUILD_TYPE=Release
        cmake --build build-net
        ctest --test-dir build-net --output-on-failure

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-windows-x64
        path: dist/

  build-android:
    name: Build for Android (arm64-v8a)
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24"
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: '' # the build needs no extra SDK packages

    - name: Install Android NDK
      run: |
        # Use the latest NDK available on the runner
        if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
          echo "ANDROID_NDK=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "Using pre-installed NDK: $ANDROID_NDK_LATEST_HOME"
        else
          # Fallback: install via sdkmanager
          yes | sdkmanager --install "ndk;$(sdkmanager --list 2>/dev/null | grep -oP 'ndk;\K[\d.]+' | sort -V | tail -1)" || true
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)
          echo "ANDROID_NDK=${NDK_DIR%/}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${NDK_DIR%/}" >> "$GITHUB_ENV"
        fi

    - name: Download SDL2 Source
      run: |
        SDL2_TAG=$(git ls-remote --tags https://github.com/libsdl-org/SDL.git 'refs/tags/release-2.*' \
          | sed 's|.*refs/tags/release-||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$SDL2_TAG" ]; then
          SDL2_TAG="2.32.10" # Fallback to a known stable version if tag retrieval fails
        fi
        echo "Using SDL2 version: $SDL2_TAG"
        wget -q "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_TAG}/SDL2-${SDL2_TAG}.tar.gz"
        tar xf "SDL2-${SDL2_TAG}.tar.gz"
        mv "SDL2-${SDL2_TAG}" sdl2-src

    # Key tracks the NDK version (compiler + chainload toolchain are in vcpkg's ABI hash) but not the system CMake version: vcpkg builds ports with its own pinned CMake.
    - name: Get toolchain ID for cache key
      run: |
        NDK_VER=$(grep -oP 'Pkg\.Revision = \K[\d.]+' "$ANDROID_NDK/source.properties" || echo unknown)
        echo "VCPKG_TC=ndk-$NDK_VER" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: vcpkg-cache
        key: vcpkg-android-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-android-${{ env.VCPKG_TC }}-
          vcpkg-android-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build SDL2 Shared Library
      run: |
        # On Android, SDL2 MUST be a shared library because the Java-side
        # SDLActivity loads it via System.loadLibrary("SDL2").
        cmake -B build-sdl2 \
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-$ANDROID_API \
          -DSDL_SHARED=ON \
          -DSDL_STATIC=OFF \
          -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/sdl2-android \
          -DCMAKE_BUILD_TYPE=Release \
          sdl2-src
        cmake --build build-sdl2 -j$(nproc)
        cmake --install build-sdl2

    - name: Build Native Library with CMake
      run: |
        ABI=arm64-v8a
        BUILD_DIR=build-android-$ABI
        SDL2_PREFIX=$GITHUB_WORKSPACE/sdl2-android

        cmake -B $BUILD_DIR \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_TARGET_TRIPLET=arm64-android \
          -DVCPKG_CMAKE_SYSTEM_VERSION=$ANDROID_API \
          -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=$ABI \
          -DANDROID_PLATFORM=android-$ANDROID_API \
          -DSDL2_DIR=$SDL2_PREFIX/lib/cmake/SDL2 \
          -DCMAKE_BUILD_TYPE=Release

        cmake --build $BUILD_DIR -j$(nproc)

        # Collect all shared libraries into jniLibs for Gradle to package
        JNILIBS=android/app/src/main/jniLibs/$ABI
        mkdir -p $JNILIBS
        cp -L $BUILD_DIR/libmain.so $JNILIBS/

        # Copy SDL2 shared library
        cp -L $SDL2_PREFIX/lib/libSDL2*.so $JNILIBS/

        # Copy any .so dependencies from vcpkg (manifest mode installs into build dir)
        VCPKG_LIB=$BUILD_DIR/vcpkg_installed/arm64-android/lib
        for so in "$VCPKG_LIB"/*.so; do
          [ -f "$so" ] && cp -L "$so" $JNILIBS/
        done

        # Strip debug symbols to reduce APK size
        STRIP=$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
        for so in "$JNILIBS"/*.so; do
          "$STRIP" --strip-unneeded "$so"
        done

        echo "Collected .so files:"
        ls -lh $JNILIBS/

    - name: Decode release keystore
      env:
        PVZP_KEYSTORE_BASE64: ${{ secrets.PVZP_KEYSTORE_BASE64 }}
        PVZP_KEYSTORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
        PVZP_KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
        PVZP_KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
      run: |
        # Secrets are empty on fork PRs; the build then falls back to debug signing.
        if [ -n "$PVZP_KEYSTORE_BASE64" ] && [ -n "$PVZP_KEYSTORE_PASSWORD" ] && [ -n "$PVZP_KEY_ALIAS" ] && [ -n "$PVZP_KEY_PASSWORD" ]; then
          echo "$PVZP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pvzp-release.keystore"
          echo "PVZP_KEYSTORE_FILE=$RUNNER_TEMP/pvzp-release.keystore" >> "$GITHUB_ENV"
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # sdl2-src ships its own wrapper jar, which is not in Gradle's known checksum database
        validate-wrappers: false

    - name: Build APK with Gradle
      env:
        PVZP_KEYSTORE_PASSWORD: ${{ secrets.PVZP_KEYSTORE_PASSWORD }}
        PVZP_KEY_ALIAS: ${{ secrets.PVZP_KEY_ALIAS }}
        PVZP_KEY_PASSWORD: ${{ secrets.PVZP_KEY_PASSWORD }}
      run: |
        cd android
        echo "sdk.dir=$ANDROID_HOME" > local.properties

        # Use gradle wrapper; package pre-built native libraries into a release APK
        gradle wrapper
        ./gradlew assembleRelease -PusePrebuiltLibs=true --no-daemon

    - name: Copy APK
      run: |
        mkdir -p dist
        find android -name "*.apk" -path "*/release/*" -exec cp {} dist/pvz-portable-android-arm64-v8a.apk \;

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-android
        path: dist/

  build-wasm:
    name: Build for WebAssembly (web)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v16

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Build libopenmpt for Emscripten
      run: |
        SYSROOT="$(em-config EMSCRIPTEN_ROOT)/cache/sysroot"
        OPENMPT_TAG=$(git ls-remote --tags https://github.com/OpenMPT/openmpt.git 'refs/tags/libopenmpt-*' \
          | sed 's|.*refs/tags/libopenmpt-||' \
          | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
        if [ -z "$OPENMPT_TAG" ]; then
          OPENMPT_TAG="0.8.4" # Fallback to a known stable version if tag retrieval fails
        fi
        echo "Using libopenmpt version: $OPENMPT_TAG"
        git clone --depth=1 --branch "libopenmpt-${OPENMPT_TAG}" https://github.com/OpenMPT/openmpt.git /tmp/libopenmpt-src
        cd /tmp/libopenmpt-src
        emmake make CONFIG=emscripten \
          STATIC_LIB=1 SHARED_LIB=0 \
          EXAMPLES=0 OPENMPT123=0 TEST=0 \
          NO_ZLIB=1 NO_MPG123=1 NO_OGG=1 NO_VORBIS=1 NO_VORBISFILE=1 \
          NO_PORTAUDIO=1 NO_PORTAUDIOCPP=1 NO_PULSEAUDIO=1 \
          NO_SDL2=1 NO_FLAC=1 NO_SNDFILE=1 \
          -j$(nproc)
        emmake make CONFIG=emscripten \
          STATIC_LIB=1 SHARED_LIB=0 \
          EXAMPLES=0 OPENMPT123=0 TEST=0 \
          PREFIX="${SYSROOT}" install

    - name: Build PvZ-Portable for WebAssembly
      run: |
        mkdir build-wasm
        emcmake cmake -G Ninja -B build-wasm -DCMAKE_BUILD_TYPE=Release
        cmake --build build-wasm -j$(nproc)

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-wasm
        path: |
          build-wasm/pvz-portable.html
          build-wasm/pvz-portable.js
          build-wasm/pvz-portable.wasm

    # Staged only when a deployment will actually happen (tag push or manual run)
    - name: Prepare GitHub Pages Artifact
      if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      run: |
        mkdir -p pages
        cp build-wasm/pvz-portable.html build-wasm/pvz-portable.js build-wasm/pvz-portable.wasm pages/
        printf '<!doctype html><meta http-equiv="refresh" content="0; url=pvz-portable.html">\n' > pages/index.html

    - name: Upload GitHub Pages Artifact
      if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      uses: actions/upload-pages-artifact@v5
      with:
        path: pages/

  deploy-wasm-pages:
    name: Deploy web build to GitHub Pages
    needs: ['build-wasm']
    # Auto-deploy on release tags; manual runs allowed via workflow_dispatch (main only)
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v5


  build-lobby:
    name: Lobby server (Go)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-go@v5
      with:
        go-version: '1.24'
        # The lobby module has no third party dependencies, so the module
        # cache would always miss (and warn) without a go.sum.
        cache: false

    - name: Vet and test
      working-directory: server
      run: |
        go vet ./...
        go test ./... -race -count=1